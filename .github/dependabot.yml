# Dependabot version updates for every ecosystem in this repository.
# Minor and patch version updates are grouped. Major updates stay
# individual, and security updates are left ungrouped.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: monthly
      timezone: "Australia/Sydney"
    open-pull-requests-limit: 2
    groups:
      npm:
        applies-to: version-updates
        patterns:
          - '*'
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-major
